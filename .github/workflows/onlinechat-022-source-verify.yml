name: OnlineChat 0.22 source integrity
on:
  push:
    paths:
      - '1FHD_OnlineChat_0.22_FIX23_Nexus-GitHub/**'
      - '.github/workflows/onlinechat-022-source-verify.yml'
  pull_request:
    paths:
      - '1FHD_OnlineChat_0.22_FIX23_Nexus-GitHub/**'
      - '.github/workflows/onlinechat-022-source-verify.yml'
jobs:
  source_sha256:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify unchanged sources
        run: |
          python3 1FHD_OnlineChat_0.22_FIX23_Nexus-GitHub/verify_source.py
          python3 1FHD_OnlineChat_0.22_FIX23_Nexus-GitHub/verify_moduleinfo_rebuild.py
